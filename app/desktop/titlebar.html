<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>ARGUS</title>
    <!-- ARGUS'un kendi başlık çubuğu (bkz. main.cjs): Windows'un ince standart çubuğu yerine biraz daha kalın,
         solda logo ve sadece "ARGUS". Sağdaki küçült / büyüt / kapat düğmelerini Windows çiziyor. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0e;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-left: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        box-sizing: border-box;
      }
      img {
        width: 20px;
        height: 20px;
        object-fit: contain;
      }
      span {
        color: #f5f5f5;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <img src="../public/logoblue.png" alt="" />
    <span>ARGUS</span>
  </body>
</html>
